name: Sync Workouts and Weight

on:
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-trigger]

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync-workouts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install ".[cloud]"
      - name: Check Paris schedule
        id: paris_time
        run: |
          hour="$(TZ=Europe/Paris date +%H)"
          if [ "$hour" = "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside 20:00 Europe/Paris; skipping."
          fi
      - name: Sync workouts
        if: github.event_name != 'schedule' || steps.paris_time.outputs.run == 'true'
        env:
          DATABASE_URL: \${{ secrets.DATABASE_URL }}
        run: hevy2garmin sync

  sync-weight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Paris schedule
        id: paris_time
        run: |
          hour="$(TZ=Europe/Paris date +%H)"
          if [ "$hour" = "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside 20:00 Europe/Paris; skipping."
          fi
      - name: Check required secrets
        if: github.event_name != 'schedule' || steps.paris_time.outputs.run == 'true'
        env:
          RENPHO_USERNAME: \${{ secrets.RENPHO_USERNAME }}
          RENPHO_PASSWORD: \${{ secrets.RENPHO_PASSWORD }}
          RENPHO_SYNC_TOKEN: \${{ secrets.RENPHO_SYNC_TOKEN }}
        run: |
          test -n "$RENPHO_USERNAME" || { echo "::error::Missing RENPHO_USERNAME secret"; exit 1; }
          test -n "$RENPHO_PASSWORD" || { echo "::error::Missing RENPHO_PASSWORD secret"; exit 1; }
          test -n "$RENPHO_SYNC_TOKEN" || { echo "::error::Missing RENPHO_SYNC_TOKEN secret"; exit 1; }
      - name: Sync Renpho measurements to Garmin
        if: github.event_name != 'schedule' || steps.paris_time.outputs.run == 'true'
        env:
          RENPHO_USERNAME: \${{ secrets.RENPHO_USERNAME }}
          RENPHO_PASSWORD: \${{ secrets.RENPHO_PASSWORD }}
          RENPHO_SYNC_TOKEN: \${{ secrets.RENPHO_SYNC_TOKEN }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://hevy2garmin-goctan.vercel.app/api/renpho-sync" \
            --header "Authorization: Bearer \${RENPHO_SYNC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg username "$RENPHO_USERNAME" \
              --arg password "$RENPHO_PASSWORD" \
              '{username: $username, password: $password, live: true}')")"
          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true and .dryRun == false' >/dev/null
